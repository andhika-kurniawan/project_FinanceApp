<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Transaksi — Personal Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js"></script>
  <style>
    /* Specific styles for detail page */
    .detail-card {
      background: var(--white);
      border-radius: 28px;
      padding: 32px 24px;
      margin: 20px 20px 0;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .detail-icon {
      width: 72px; height: 72px;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .detail-icon i { width: 36px; height: 36px; }
    .detail-amount {
      font-size: 34px; font-weight: 800; letter-spacing: -0.03em;
      margin-bottom: 8px; font-variant-numeric: tabular-nums;
    }
    .detail-title {
      font-size: 16px; font-weight: 600; color: var(--neutral-600);
      margin-bottom: 32px;
    }
    
    .detail-info {
      background: var(--neutral-50);
      border-radius: 20px;
      padding: 8px 20px;
      text-align: left;
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0;
      border-bottom: 1px dashed var(--neutral-200);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      font-size: 13px; font-weight: 500; color: var(--neutral-500);
    }
    .detail-value {
      font-size: 14px; font-weight: 700; color: var(--neutral-900);
      display: flex; align-items: center; gap: 8px;
    }
    
    .detail-actions {
      display: flex; gap: 12px; padding: 24px 20px;
    }
    .btn-action {
      flex: 1; padding: 16px; border-radius: 16px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; transition: all 0.2s; font-family: var(--font);
    }
    .btn-edit { background: var(--primary-500); color: var(--white); box-shadow: 0 4px 12px rgba(59,130,246,0.25); }
    .btn-edit:hover { background: var(--primary-600); }
    .btn-delete { background: var(--color-expense-light); color: var(--color-expense); }
    .btn-delete:hover { background: #fecaca; }
  </style>
</head>
<body>
  <div class="app">
    <!-- TOP BAR -->
    <div class="topbar" style="background: transparent; border: none; padding-top: 20px;">
      <button class="topbar__back" onclick="history.back()" title="Kembali" style="border-radius: 50%; width: 44px; height: 44px; background: rgba(0,0,0,0.05);">
        <i data-lucide="chevron-left" style="width:24px;height:24px"></i>
      </button>
      <div class="topbar__title-col" style="flex:1; margin-left: 12px;">
        <div class="topbar__title" style="font-size: 18px;">Detail Transaksi</div>
      </div>
      <div style="width: 44px;"></div>
    </div>
    
    <div class="app-scroll" id="detailContent">
       <!-- injected by JS -->
    </div>
  </div>

  <!-- TRANSACTION MODAL -->
  <div class="modal-overlay" id="txnModal">
    <div class="modal-content">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title">Tambah Transaksi</h3>
        <button class="modal-close" onclick="closeModal()"><i data-lucide="x" style="width:18px;height:18px"></i></button>
      </div>
      <form id="txnForm" onsubmit="handleFormSubmit(event)" style="display:flex;flex-direction:column;gap:20px;">
        <div class="segment-control">
          <button type="button" class="segment-btn active" data-val="expense" onclick="setTxnType('expense')">Pengeluaran</button>
          <button type="button" class="segment-btn" data-val="income" onclick="setTxnType('income')">Pemasukan</button>
        </div>
        <input type="hidden" id="txnType" value="expense">
        <div class="form-group">
          <label class="form-label">Nominal</label>
          <div class="nominal-wrapper">
            <span class="nominal-prefix">Rp</span>
            <input type="number" class="nominal-input" id="txnAmount" placeholder="0" min="1" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Kategori</label>
          <div class="category-grid" id="categoryGrid"></div>
          <input type="hidden" id="txnCategory" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Wallet</label>
            <select class="form-select" id="txnWallet" required>
              <option value="BCA">BCA</option>
              <option value="GoPay">GoPay</option>
              <option value="OVO">OVO</option>
              <option value="Cash">Tunai</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tanggal</label>
            <input type="date" class="form-input" id="txnDate" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Catatan</label>
          <input type="text" class="form-input" id="txnName" placeholder="Contoh: Makan siang di kantin" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn-submit">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    window.closeModal = function() {
      PW.modal.close();
    };

    window.setTxnType = function(type) {
      PW.modal.setType(type);
    };

    window.handleFormSubmit = function(e) {
      if (PW.modal._form) {
        PW.modal._handleSubmit.call(PW.modal, e);
      }
    };
  </script>

  <script src="assets/js/detail.js"></script>
</body>
</html>
